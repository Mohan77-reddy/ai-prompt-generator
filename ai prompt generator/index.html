<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Prompt Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>⚡ AI Prompt Generator</h1>

  <select id="category">
    <option value="image">Image Prompt</option>
    <option value="chatgpt">ChatGPT Prompt</option>
    <option value="trading">Trading Prompt</option>
    <option value="coding">Coding Prompt</option>
  </select>

  <input type="text" id="userInput" placeholder="Enter your idea...">

  <button id="generateBtn" onclick="generatePrompt()">Generate Prompt</button>

  <textarea id="output" placeholder="Your prompt will appear here..."></textarea>

  <button id="copyBtn" onclick="copyPrompt()">Copy Prompt</button>

  <h3>Saved Prompts</h3>
  <ul id="savedList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
